<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Нарды</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eeec;--ink:#17262a;--mut:#5d7276;--l:#d6e2dc;--d:#5b8a82;--frame:#1f3033;--acc:#e9a93a;--wp:#fffaf0;--bp:#16212a;--bw:min(94vw,760px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1819;--ink:#e3eeec;--mut:#8aa3a6;--l:#a9c2ba;--d:#3f6a63;--frame:#050b0c;--bp:#0b1116}}
:root[data-theme="dark"]{--bg:#0f1819;--ink:#e3eeec;--mut:#8aa3a6;--l:#a9c2ba;--d:#3f6a63;--frame:#050b0c;--bp:#0b1116}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Spectral,Georgia,serif}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 10px}
.frame{padding:clamp(6px,1.6vw,14px);background:var(--frame);border-radius:6px;box-shadow:0 22px 44px -20px rgba(5,20,20,.6)}
.nb{display:grid;grid-template-columns:repeat(6,1fr) .5fr repeat(6,1fr) .9fr;grid-template-rows:1fr 1fr;width:var(--bw);height:calc(var(--bw)*.72);background:#22383a}
.pt{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:2px 0}
.pt.bot{flex-direction:column-reverse}
.pt::before{content:"";position:absolute;inset:0 7%;background:var(--c)}
.pt.top::before{clip-path:polygon(0 0,100% 0,50% 92%)}.pt.bot::before{clip-path:polygon(0 100%,100% 100%,50% 8%)}
.pt.a{--c:var(--d)}.pt.b{--c:var(--l)}.pt.dot{--c:var(--acc)}
.pt.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.ck{position:relative;z-index:1;width:84%;max-width:34px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:600;flex:none;box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 0 0 2px rgba(0,0,0,.2),inset 0 0 0 5px rgba(255,255,255,.14)}
.ck.w{background:radial-gradient(circle at 35% 30%,#fff,var(--wp) 55%,#d4c9b3);color:#5a410a}
.ck.b{background:radial-gradient(circle at 35% 30%,#3d4e5a,var(--bp) 62%);color:#e9c46a}
.bar{grid-column:7;grid-row:1/3;background:rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4px 0;cursor:pointer}
.bar.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.bs{display:flex;flex-direction:column;align-items:center;width:100%;gap:2px}
.tray{grid-column:14;grid-row:1/3;display:grid;grid-template-rows:1fr 1fr;background:rgba(0,0,0,.28)}
.th{display:grid;place-items:center;color:var(--l);font-weight:600;cursor:pointer}
.th.dot{background:var(--acc);color:#111}
.nb.flip{transform:rotate(180deg)}.nb.flip .ck,.nb.flip .th{transform:rotate(180deg)}
.side{width:min(94vw,520px);display:flex;flex-direction:column;gap:12px}
h1{font-size:2.4rem;font-weight:600;margin:0;letter-spacing:-.01em}
.status{font-size:1.15rem;margin:0;min-height:1.6em}
.vn,.sub,#ruleinfo,#score{margin:0;color:var(--mut)}
#dice{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.die{width:44px;height:44px;box-sizing:border-box;border-radius:9px;background:var(--wp);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.die i{border-radius:50%}.die i.on{background:#1b2a2e}.die.used{opacity:.3}
button{font:inherit;font-size:1rem;color:var(--ink);background:transparent;border:1.5px solid var(--frame);border-radius:4px;padding:9px 12px;cursor:pointer}
button:hover{background:rgba(91,138,130,.18)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.primary,button.on{background:var(--frame);color:var(--bg)}
.row{display:flex;gap:8px}.row button{flex:1}
.menu{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 14px;box-sizing:border-box}
.mcard{width:min(94vw,480px);display:flex;flex-direction:column;gap:18px;text-align:center}
.mlogo{display:flex;gap:10px;justify-content:center}.mlogo .die{width:56px;height:56px}
.menu h1{font-size:3.2rem}
.mgroup h2{font-size:.85rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.opts{display:flex;gap:8px}
.opt{flex:1;display:flex;flex-direction:column;gap:2px;padding:12px 6px}
.opt span{font-size:.8rem;color:var(--mut)}.opt.on span{color:inherit;opacity:.75}
.big{font-size:1.3rem;padding:14px}
</style>
<script>
if(!window.structuredClone)window.structuredClone=o=>JSON.parse(JSON.stringify(o));
addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#b3261e;color:#fff;padding:8px;font:14px sans-serif';d.textContent='Ошибка: '+e.message;(document.body||document.documentElement).append(d)});
(function(){try{
 if(window.AndroidBridge&&AndroidBridge.VKWebAppInit)AndroidBridge.VKWebAppInit(JSON.stringify({}));
 else if(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.VKWebAppInit)webkit.messageHandlers.VKWebAppInit.postMessage({});
 else if(parent!==window)parent.postMessage({handler:'VKWebAppInit',params:{},type:'vk-connect'},'*')}catch(e){}})();
</script>
<script async src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js" onload="try{vkBridge.send('VKWebAppInit',{})}catch(e){}"></script>
</head><body>
<div id="menu" class="menu"><div class="mcard">
<div class="mlogo" id="logo" aria-hidden="true"></div>
<h1>Нарды</h1>
<div class="mgroup"><h2>Режим</h2><div class="opts" data-k="mode">
<button class="opt on" data-v="2"><b>Вдвоём</b><span>на одном устройстве</span></button>
<button class="opt" data-v="1"><b>С компьютером</b><span>против бота</span></button></div></div>
<div class="mgroup"><h2>Вид нард</h2><div class="opts" data-k="v">
<button class="opt on" data-v="short"><b>Короткие</b><span>с боем и баром</span></button>
<button class="opt" data-v="long"><b>Длинные</b><span>без боя, с головы</span></button></div></div>
<div id="vsai" hidden>
<div class="mgroup"><h2>Ваша сторона</h2><div class="opts" data-k="side">
<button class="opt on" data-v="w"><b>Белые</b></button>
<button class="opt" data-v="b"><b>Чёрные</b></button>
<button class="opt" data-v="r"><b>Случайно</b></button></div></div>
<div class="mgroup"><h2>Сложность</h2><div class="opts" data-k="lvl">
<button class="opt on" data-v="0"><b>Лёгкий</b><span>ходит наугад</span></button>
<button class="opt" data-v="1"><b>Средний</b><span>считает выгоду</span></button></div></div></div>
<p id="ruleinfo"></p>
<button id="play" class="primary big">Играть</button>
</div></div>
<div id="game" hidden><main class="app">
<div class="frame"><div id="board" class="nb" role="grid" aria-label="Доска"></div></div>
<div class="side">
<h1>Нарды</h1>
<p class="vn" id="vn"></p>
<p id="status" class="status" aria-live="polite"></p>
<div id="dice"></div>
<button id="roll" class="primary">Бросить кости</button>
<p id="score"></p>
<div class="row"><button id="undo">Отменить ход</button><button id="flip">Повернуть</button></div>
<div class="row"><button id="new">Новая партия</button><button id="tomenu">← В меню</button></div>
</div></main></div>
<script>
const $=s=>document.querySelector(s);
// ===== ДВИЖОК =====
const O=p=>p==='w'?'b':'w';
const pos=(V,p,i)=>p==='w'?23-i:(V==='long'?(11-i+24)%24:i),idx=(V,p,s)=>p==='w'?23-s:(V==='long'?(11-s+24)%24:s);
function newState(V,first){const n={w:Array(24).fill(0),b:Array(24).fill(0)};
 if(V==='long'){n.w[23]=15;n.b[11]=15}else{n.w[23]=2;n.w[12]=5;n.w[7]=3;n.w[5]=5;n.b[0]=2;n.b[11]=5;n.b[16]=3;n.b[18]=5}
 return{n,bar:{w:0,b:0},off:{w:0,b:0},t:first,rem:[],dv:[],ph:'roll',hd:0,ft:{w:1,b:1},res:null}}
const cl=S=>({n:{w:S.n.w.slice(),b:S.n.b.slice()},bar:{...S.bar},off:{...S.off},t:S.t,rem:S.rem.slice(),dv:S.dv,ph:S.ph,hd:S.hd,ft:S.ft,res:S.res});
function allHome(S,V,p){if(S.bar[p])return false;for(let i=0;i<24;i++)if(S.n[p][i]&&pos(V,p,i)<18)return false;return true}
function six(S,V,p,f,j){const n=S.n[p].slice(),e=S.n[O(p)];n[f]--;n[j]++;const oc=Array.from({length:24},(_,s)=>n[idx(V,p,s)]>0);
 for(let k=0;k<=18;k++){if(oc.slice(k,k+6).every(Boolean)){let ahead=false;for(let i=0;i<24;i++)if(e[i]&&pos(V,p,i)>k+5){ahead=true;break}if(!ahead)return true}}
 return false}
function single(S,V,die){const p=S.t,q=O(p),n=S.n[p],e=S.n[q],out=[],hi=p==='w'?23:11;
 const lim=(S.ft[p]&&S.dv[0]===S.dv[1]&&[3,4,6].includes(S.dv[0]))?2:1;
 if(V==='short'&&S.bar[p]){const j=idx(V,p,die-1);if(e[j]<2)out.push({f:'bar',t:j,d:die,h:e[j]===1});return out}
 const hm=allHome(S,V,p);
 for(let i=0;i<24;i++){if(!n[i])continue;const s=pos(V,p,i),t=s+die;
  if(t<24){const j=idx(V,p,t);
   if(V==='long'){if(e[j]||(i===hi&&S.hd>=lim)||six(S,V,p,i,j))continue;out.push({f:i,t:j,d:die})}
   else if(e[j]<2)out.push({f:i,t:j,d:die,h:e[j]===1})}
  else if(hm){let ok=t===24;if(!ok){ok=true;for(let k=0;k<24;k++)if(n[k]){const sk=pos(V,p,k);if(sk<s&&sk>=18){ok=false;break}}}
   if(ok)out.push({f:i,t:'off',d:die})}}
 return out}
function doMove(S,V,m){const T=cl(S),p=S.t,q=O(p);
 if(m.f==='bar')T.bar[p]--;else{T.n[p][m.f]--;if(V==='long'&&m.f===(p==='w'?23:11))T.hd++}
 if(m.t==='off')T.off[p]++;else{if(m.h){T.n[q][m.t]--;T.bar[q]++}T.n[p][m.t]++}
 T.rem.splice(T.rem.indexOf(m.d),1);return T}
const MM=new Map(),key=S=>S.t+S.n.w+'|'+S.n.b+'|'+S.bar.w+S.bar.b+'|'+S.hd+'|'+S.rem;
function maxUse(S,V){if(!S.rem.length)return 0;const k=key(S);if(MM.has(k))return MM.get(k);let best=0;
 outer:for(const d of new Set(S.rem))for(const m of single(S,V,d)){best=Math.max(best,1+maxUse(doMove(S,V,m),V));if(best===S.rem.length)break outer}
 MM.set(k,best);return best}
function legal(S,V){const tot=maxUse(S,V);if(!tot)return[];let out=[];
 for(const d of new Set(S.rem))for(const m of single(S,V,d))if(1+maxUse(doMove(S,V,m),V)===tot)out.push(m);
 if(tot===1&&S.rem.length===2&&S.rem[0]!==S.rem[1]){const big=Math.max(...S.rem);if(out.some(m=>m.d===big))out=out.filter(m=>m.d===big)}
 return out}
function pips(T,V,p){let s=T.bar[p]*25;for(let i=0;i<24;i++)s+=T.n[p][i]*(24-pos(V,p,i));return s}
function sc2(T,V,p){const q=O(p);let v=pips(T,V,q)-pips(T,V,p);
 if(V==='short'){v+=T.bar[q]*8;for(let i=0;i<24;i++){const c=T.n[p][i];if(c>1)v+=1;if(c===1){const eb=pos(V,q,i);let risk=T.bar[q]&&eb<=5;
   for(let j=0;j<24&&!risk;j++)if(T.n[q][j]){const d=eb-pos(V,q,j);if(d>0&&d<=6)risk=true}
   if(risk)v-=7}}}
 else{let u=0;for(let i=0;i<24;i++)if(T.n[p][i])u++;v+=.5*u}
 return v}
// ===== ИНТЕРФЕЙС =====
const PIPS=[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]],nm=p=>p==='w'?'белых':'чёрных';
const dieH=(v,u)=>`<div class="die${u?' used':''}">${Array.from({length:9},(_,i)=>`<i${PIPS[v-1].includes(i)?' class="on"':''}></i>`).join('')}</div>`;
let S,V='short',mode=2,hu='w',lvl=0,H=[],sel=null,LM=[],flip=false,busy=false,gid=0,sc={w:0,b:0},starter='w';
const can=()=>mode===2||S.t===hu;
function begin(){gid++;MM.clear();S=newState(V,starter);H=[];sel=null;LM=[];busy=false;
 $('#vn').textContent=(V==='long'?'Длинные нарды':'Короткие нарды')+(mode===1?' · против компьютера':' · вдвоём');render();aiTurn()}
function roll(){if(S.ph!=='roll')return;const a=1+Math.random()*6|0,b=1+Math.random()*6|0,g=gid;
 S.dv=[a,b];S.rem=a===b?[a,a,a,a]:[a,b];S.ph='move';S.hd=0;H=[];sel=null;LM=legal(S,V);render();
 if(!LM.length)setTimeout(()=>{if(g===gid)endTurn()},1500)}
function endTurn(){S.ft[S.t]=0;S.t=O(S.t);S.ph='roll';S.rem=[];S.dv=[];S.hd=0;H=[];sel=null;LM=[];render();aiTurn()}
function doPlay(m){const g=gid,src=$(`#board [data-i="${m.f}"]`),r0=src&&src.getBoundingClientRect();
 H.push(S);S=doMove(S,V,m);sel=null;
 if(S.off[S.t]===15){const w=S.t,l=O(w),mars=S.off[l]===0;S.ph='over';S.res={w,mars};sc[w]+=mars?2:1;starter=l;LM=[];render();return}
 LM=legal(S,V);render();
 const dst=m.t==='off'?null:$(`#board [data-i="${m.t}"]`),el=dst&&dst.lastElementChild;
 if(el&&r0&&el.animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const r1=el.getBoundingClientRect();
  el.animate([{transform:`translate(${r0.left+r0.width/2-r1.left-r1.width/2}px,${r0.top+r0.height/2-r1.top-r1.height/2}px)`,zIndex:5},{transform:'none'}],{duration:260,easing:'ease-in-out'})}
 if(!LM.length)setTimeout(()=>{if(g===gid)endTurn()},700);else aiTurn()}
function pick(){if(!lvl)return LM[Math.random()*LM.length|0];let best=null,bs=-1e9;
 for(const x of LM){const v=sc2(doMove(S,V,x),V,S.t)+Math.random()*.3;if(v>bs){bs=v;best=x}}return best}
function aiTurn(){if(mode!==1||S.ph==='over'||S.t===hu)return;busy=true;const g=gid;
 setTimeout(()=>{if(g!==gid)return;busy=false;if(S.ph==='roll'){roll();if(LM.length)aiTurn()}else if(LM.length)doPlay(pick())},S.ph==='roll'?700:450)}
function render(){const B=$('#board');B.innerHTML='';B.classList.toggle('flip',flip);
 const dests=new Set(sel===null?[]:LM.filter(m=>m.f===sel).map(m=>m.t));
 const mk=(cls,i)=>{const d=document.createElement('div');d.className=cls;d.dataset.i=i;return d};
 const stack=(el,p,c)=>{for(let k=0;k<Math.min(c,5);k++){const s=document.createElement('span');s.className='ck '+p;if(k===4&&c>5)s.textContent=c;el.append(s)}};
 for(let i=0;i<24;i++){const top=i>=12,col=top?(i<18?i-11:i-10):(i>=6?12-i:13-i);
  const d=mk(`pt ${top?'top':'bot'} ${i%2?'a':'b'}${dests.has(i)?' dot':''}${sel===i?' sel':''}`,i);
  d.style.gridColumn=col;d.style.gridRow=top?1:2;stack(d,S.n.w[i]?'w':'b',S.n.w[i]||S.n.b[i]);B.append(d)}
 const bar=mk('bar'+(sel==='bar'?' sel':''),'bar'),tb=document.createElement('div'),bb=document.createElement('div');tb.className=bb.className='bs';
 stack(tb,'b',S.bar.b);stack(bb,'w',S.bar.w);bar.append(tb,bb);B.append(bar);
 const tr=document.createElement('div');tr.className='tray';
 for(const p of['b','w']){const h=mk('th'+(dests.has('off')&&S.t===p?' dot':''),'off');h.textContent=S.off[p]||'';tr.append(h)}B.append(tr);
 const rm=S.rem.slice(),vs=S.dv[0]===S.dv[1]?[S.dv[0],S.dv[0],S.dv[0],S.dv[0]]:S.dv;
 $('#dice').innerHTML=S.dv.length?vs.map(v=>{const k=rm.indexOf(v);if(k>=0)rm.splice(k,1);return dieH(v,k<0)}).join(''):'';
 $('#roll').hidden=!(S.ph==='roll'&&can());
 $('#status').textContent=S.ph==='over'?`Победили ${nm(S.res.w)}${S.res.mars?' (с марсом)':''}`:S.ph==='roll'?`Бросок ${nm(S.t)}`:!LM.length?'Нет ходов — ход переходит':`Ход ${nm(S.t)}`+(V==='short'&&S.bar[S.t]?' — сначала верните шашку с бара':'');
 $('#score').textContent=`Счёт: белые ${sc.w} : ${sc.b} чёрные`}
$('#board').onclick=e=>{const el=e.target.closest('[data-i]');if(!el||busy||S.ph!=='move'||!can())return;
 const i=(el.dataset.i==='bar'||el.dataset.i==='off')?el.dataset.i:+el.dataset.i;
 const mv=sel!==null&&LM.filter(m=>m.f===sel&&m.t===i).sort((a,b)=>a.d-b.d)[0];
 if(mv){doPlay(mv);return}
 sel=LM.some(m=>m.f===i)?i:null;render()};
$('#roll').onclick=()=>{if(can())roll()};
$('#new').onclick=begin;
$('#flip').onclick=()=>{flip=!flip;render()};
$('#undo').onclick=()=>{if(busy||!H.length||S.ph!=='move'||!can())return;S=H.pop();LM=legal(S,V);sel=null;render()};
$('#tomenu').onclick=()=>{gid++;busy=false;$('#game').hidden=true;$('#menu').hidden=false};
const MS={mode:'2',v:'short',side:'w',lvl:'0'},INFO={short:'Короткие нарды: по 15 шашек, одинокую шашку можно сбить, она уходит на бар и входит заново. Выигрывает тот, кто первым вынес все шашки.',long:'Длинные нарды: все шашки идут с «головы» по кругу, бить нельзя. С головы берётся одна шашка за ход, нельзя строить шесть подряд, пока у соперника нет шашки впереди.'};
function info(){$('#ruleinfo').textContent=INFO[MS.v]}
document.querySelectorAll('.opts').forEach(g=>g.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;
 g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));MS[g.dataset.k]=b.dataset.v;$('#vsai').hidden=MS.mode!=='1';info()});
$('#play').onclick=()=>{mode=+MS.mode;lvl=+MS.lvl;V=MS.v;hu=MS.side==='r'?(Math.random()<.5?'w':'b'):MS.side;flip=mode===1&&hu==='b';sc={w:0,b:0};starter='w';
 $('#menu').hidden=true;$('#game').hidden=false;begin()};
$('#logo').innerHTML=dieH(5)+dieH(2);info();
</script></body></html>
